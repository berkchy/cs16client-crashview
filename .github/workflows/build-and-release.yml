name: build & release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version tag (default: 1.10.0)'
        required: false
        default: '1.10.0'

permissions:
  contents: write

env:
  BUNDLE_VERSION: ${{ github.event.inputs.version || '1.10.0' }}
  ANDROID_DIR: android

# NOTE: intentionally a SINGLE job. The old 3-job layout passed ~200 MB
# through Actions artifacts on every tag and hit the repo artifact quota.
# All stages run sequentially anyway (needs:), so nothing is lost.
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Detect build type
        id: build_type
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $MSG"
          LOWER=$(echo "$MSG" | tr '[:upper:]' '[:lower:]')
          NEEDS_APK=false
          NEEDS_BUNDLE=false
          if echo "$LOWER" | grep -q '\[android build\]' || echo "$LOWER" | grep -q '\[version build\]'; then
            NEEDS_APK=true
          fi
          NEEDS_BUNDLE=true
          # Escape multiline for GitHub Actions output
          ESCAPED=$(echo "$MSG" | head -1 | sed 's/"/\\"/g')
          echo "commit_msg=$ESCAPED" >> "$GITHUB_OUTPUT"
          echo "needs_apk=$NEEDS_APK" >> "$GITHUB_OUTPUT"
          echo "needs_bundle=$NEEDS_BUNDLE" >> "$GITHUB_OUTPUT"
          echo "APK build: $NEEDS_APK | Bundle build: $NEEDS_BUNDLE"

      - name: Checkout addons from amxx-addons branch
        shell: bash
        run: |
          git fetch origin amxx-addons
          git checkout origin/amxx-addons -- addons/

      - name: Set up JDK
        if: steps.build_type.outputs.needs_apk == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK/NDK tooling
        uses: android-actions/setup-android@v3
      - name: Install NDK r25c
        shell: bash
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" \
            || (SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1); \
                [ -n "$SDKM" ] && echo "y" | "$SDKM" "ndk;25.2.9519653")
          NDK_ROOT=$(ls -d "$ANDROID_HOME"/ndk/25.2.9519653 2>/dev/null)
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          command -v cmake >/dev/null || sudo apt-get update
          command -v cmake >/dev/null || sudo apt-get install -y cmake
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build

      - name: Cross-compile core + modules + plugins
        shell: bash
        run: |
          # amxmodx is fetched from upstream by build-amxx.sh and customized
          # by ./patches/; hlsdk + metamod-p are vendored directly in android/
          # (android/hlsdk, android/mm-p), so no overlay copy step is needed.
          # arm64-v8a is mandatory; armeabi-v7a is best-effort (trial) and its
          # failure only drops the v7a bundle, it never fails the workflow.
          for ABI in arm64-v8a armeabi-v7a; do
            if bash ./android/ci/build-amxx.sh "$GITHUB_WORKSPACE/src" "$ANDROID_NDK_HOME" \
                "$GITHUB_WORKSPACE/build-out" "$GITHUB_WORKSPACE/android/plugins-src" "$ABI"; then
              echo "::group::OK $ABI"
              ls -l "$GITHUB_WORKSPACE/build-out/lib/$ABI" 2>/dev/null
              echo "::endgroup::"
            else
              echo "::endgroup::"
              if [ "$ABI" = "arm64-v8a" ]; then
                echo "::error::arm64-v8a cross-compile failed (required)"
                exit 1
              fi
              echo "::warning::armeabi-v7a cross-compile failed — v7a bundle will be skipped"
              touch "$GITHUB_WORKSPACE/v7a-missing"
            fi
          done

      - name: Package release bundles
        shell: bash
        run: |
          RELEASE_VERSION="$BUNDLE_VERSION" python3 ./android/ci/gen-bundle.py \
            arm64-v8a \
            "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a" \
            "$GITHUB_WORKSPACE/amxx-bundle.zip" \
            "$GITHUB_WORKSPACE/build-out/plugins" \
            "$GITHUB_WORKSPACE/amxx-plugins.zip"
          if [ ! -f "$GITHUB_WORKSPACE/v7a-missing" ] && \
              [ -f "$GITHUB_WORKSPACE/build-out/lib/armeabi-v7a/libamxmodx.so" ]; then
            RELEASE_VERSION="$BUNDLE_VERSION" python3 ./android/ci/gen-bundle.py \
              armeabi-v7a \
              "$GITHUB_WORKSPACE/build-out/lib/armeabi-v7a" \
              "$GITHUB_WORKSPACE/amxx-bundle-armeabi-v7a.zip"
          else
            echo "::warning::No amxmodx core for armeabi-v7a — v7a bundle skipped"
          fi
          cd "$GITHUB_WORKSPACE"
          # Remove hardcoded gamedll from metamod config — let metamod-fwgs
          # auto-detect the correct game DLL name per architecture via
          # COM_GenerateCommonLibraryName (library-suffix submodule).
          if [ -f addons/metamod/config.ini ]; then
            sed -i '/^gamedll /d' addons/metamod/config.ini
          fi
          zip -r amxx-addons.zip addons/ -x '*.git*'

      - name: Install Android SDK platform & build tools
        if: steps.build_type.outputs.needs_apk == 'true'
        shell: bash
        run: |
          # The runner's preinstalled sdkmanager is too old for current SDK XML
          # (v4), which silently breaks --install. Use a fresh cmdline-tools zip.
          CMDT=commandlinetools-linux-11076708_latest.zip
          mkdir -p "$RUNNER_TEMP/sdkman"
          curl -fsSL -o "$RUNNER_TEMP/$CMDT" "https://dl.google.com/android/repository/$CMDT"
          rm -rf "$RUNNER_TEMP/sdkman/cmdline-tools"
          unzip -qo "$RUNNER_TEMP/$CMDT" -d "$RUNNER_TEMP/sdkman"
          SDKM="$RUNNER_TEMP/sdkman/cmdline-tools/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        if: steps.build_type.outputs.needs_apk == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Bundle debug signing keystore into app assets
        if: steps.build_type.outputs.needs_apk == 'true'
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/keystore
          cp android/debug/patcher-release.p12 android/app/src/main/assets/keystore/debug.p12
          cp android/debug/debug_key.pem android/app/src/main/assets/keystore/debug_key.pem
          cp android/debug/debug_cert.pem android/app/src/main/assets/keystore/debug_cert.pem

      - name: Embed amxxpc + modules as native libs (nativeLibraryDir)
        if: steps.build_type.outputs.needs_apk == 'true'
        shell: bash
        run: |
          # amxxpc compiler (produced by build-amxx.sh; no longer inside the bundle)
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/amxxpc" android/app/src/main/jniLibs/arm64-v8a/libamxxpc.so
          cp "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/amxxpc32.so" android/app/src/main/jniLibs/arm64-v8a/libamxxpc32.so
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libamxxpc.so
          # AMXX modules — CS16Client loads them via nativeLibraryDir dlopen
          for so in $(unzip -l "$GITHUB_WORKSPACE/amxx-bundle.zip" | grep 'lib/arm64-v8a/lib.*_amxx_amd64.so' | awk '{print $NF}'); do
            name=$(basename "$so")
            unzip -p "$GITHUB_WORKSPACE/amxx-bundle.zip" "$so" > "android/app/src/main/jniLibs/arm64-v8a/$name"
            chmod +x "android/app/src/main/jniLibs/arm64-v8a/$name"
          done
          # core lib
          unzip -p "$GITHUB_WORKSPACE/amxx-bundle.zip" lib/arm64-v8a/libamxmodx.so > android/app/src/main/jniLibs/arm64-v8a/libamxmodx.so
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libamxmodx.so
          # armeabi-v7a runtime (best-effort; makes the patcher usable on 32-bit
          # devices and compile on-device for v7a). Only when CI produced it.
          if [ ! -f "$GITHUB_WORKSPACE/v7a-missing" ] && \
              [ -f "$GITHUB_WORKSPACE/build-out/lib/armeabi-v7a/libamxmodx.so" ]; then
            mkdir -p android/app/src/main/jniLibs/armeabi-v7a
            cp "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/amxxpc" android/app/src/main/jniLibs/armeabi-v7a/libamxxpc.so 2>/dev/null || true
            cp "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/amxxpc32.so" android/app/src/main/jniLibs/armeabi-v7a/libamxxpc32.so 2>/dev/null || true
            chmod +x android/app/src/main/jniLibs/armeabi-v7a/libamxxpc.so 2>/dev/null || true
            for so in $(unzip -l "$GITHUB_WORKSPACE/amxx-bundle-armeabi-v7a.zip" | grep 'lib/armeabi-v7a/lib.*_amxx_arm.so' | awk '{print $NF}'); do
              name=$(basename "$so")
              unzip -p "$GITHUB_WORKSPACE/amxx-bundle-armeabi-v7a.zip" "$so" > "android/app/src/main/jniLibs/armeabi-v7a/$name"
              chmod +x "android/app/src/main/jniLibs/armeabi-v7a/$name"
            done
            unzip -p "$GITHUB_WORKSPACE/amxx-bundle-armeabi-v7a.zip" lib/armeabi-v7a/libamxmodx.so > android/app/src/main/jniLibs/armeabi-v7a/libamxmodx.so 2>/dev/null || true
            chmod +x android/app/src/main/jniLibs/armeabi-v7a/libamxmodx.so 2>/dev/null || true
            ls -lh android/app/src/main/jniLibs/armeabi-v7a/
          fi
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Build the patcher APK
        if: steps.build_type.outputs.needs_apk == 'true'
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.build_type.outputs.commit_msg }}
          files: |
            amxx-bundle.zip
            amxx-bundle-armeabi-v7a.zip
            amxx-plugins.zip
            amxx-addons.zip
            ${{ steps.build_type.outputs.needs_apk == 'true' && 'android/app/build/outputs/apk/release/*.apk' || '' }}
          generate_release_notes: true
          fail_on_unmatched_files: false
