name: build & release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version tag (default: 1.10.0)'
        required: false
        default: '1.10.0'

permissions:
  contents: write

env:
  BUNDLE_VERSION: ${{ github.event.inputs.version || '1.10.0' }}
  ANDROID_DIR: android

jobs:
  amxx-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout addons from amxx-addons branch
        shell: bash
        run: |
          git fetch origin amxx-addons
          git checkout origin/amxx-addons -- addons/

      - name: Set up Android SDK/NDK tooling
        uses: android-actions/setup-android@v3
      - name: Install NDK r25c
        shell: bash
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" \
            || (SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1); \
                [ -n "$SDKM" ] && echo "y" | "$SDKM" "ndk;25.2.9519653")
          NDK_ROOT=$(ls -d "$ANDROID_HOME"/ndk/25.2.9519653 2>/dev/null)
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          command -v cmake >/dev/null || sudo apt-get update
          command -v cmake >/dev/null || sudo apt-get install -y cmake
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build

      - name: Cross-compile core + modules + plugins
        shell: bash
        run: |
          # amxmodx is fetched from upstream by build-amxx.sh and customized
          # by ./patches/; hlsdk + metamod-p are vendored directly in android/
          # (android/hlsdk, android/mm-p), so no overlay copy step is needed.
          bash ./android/ci/build-amxx.sh "$GITHUB_WORKSPACE/src" "$ANDROID_NDK_HOME" \
            "$GITHUB_WORKSPACE/build-out" "$GITHUB_WORKSPACE/android/plugins-src"

      - name: Package release bundles
        shell: bash
        run: |
          RELEASE_VERSION="$BUNDLE_VERSION" python3 ./android/ci/gen-bundle.py \
            "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a" \
            "$GITHUB_WORKSPACE/amxx-bundle.zip" \
            "$GITHUB_WORKSPACE/build-out/plugins" \
            "$GITHUB_WORKSPACE/amxx-plugins.zip" \
            "$GITHUB_WORKSPACE/addons"
          cd "$GITHUB_WORKSPACE"
          zip -r amxx-addons.zip addons/ -x '*.git*'

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: |
            amxx-bundle.zip
            amxx-plugins.zip
            amxx-addons.zip

  app-apk:
    needs: amxx-bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build tools
        shell: bash
        run: |
          # The runner's preinstalled sdkmanager is too old for current SDK XML
          # (v4), which silently breaks --install. Use a fresh cmdline-tools zip.
          CMDT=commandlinetools-linux-11076708_latest.zip
          mkdir -p "$RUNNER_TEMP/sdkman"
          curl -fsSL -o "$RUNNER_TEMP/$CMDT" "https://dl.google.com/android/repository/$CMDT"
          rm -rf "$RUNNER_TEMP/sdkman/cmdline-tools"
          unzip -qo "$RUNNER_TEMP/$CMDT" -d "$RUNNER_TEMP/sdkman"
          SDKM="$RUNNER_TEMP/sdkman/cmdline-tools/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Bundle debug signing keystore into app assets
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/keystore
          cp android/debug/patcher-release.p12 android/app/src/main/assets/keystore/debug.p12
          cp android/debug/debug_key.pem android/app/src/main/assets/keystore/debug_key.pem
          cp android/debug/debug_cert.pem android/app/src/main/assets/keystore/debug_cert.pem

      - name: Download release bundles (for app fallback)
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: bundles

      - name: Embed bundle into app assets (offline fallback)
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/bundle
          cp bundles/amxx-bundle.zip android/app/src/main/assets/bundle/bundle.zip

      - name: Embed amxxpc + modules as native libs (nativeLibraryDir)
        shell: bash
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          # amxxpc compiler
          unzip -p bundles/amxx-bundle.zip compiler/amxxpc > android/app/src/main/jniLibs/arm64-v8a/libamxxpc.so
          unzip -p bundles/amxx-bundle.zip compiler/amxxpc32.so > android/app/src/main/jniLibs/arm64-v8a/libamxxpc32.so
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libamxxpc.so
          # AMXX modules — CS16Client loads them via nativeLibraryDir dlopen
          for so in $(unzip -l bundles/amxx-bundle.zip | grep 'lib/arm64-v8a/lib.*_amxx_amd64.so' | awk '{print $NF}'); do
            name=$(basename "$so")
            unzip -p bundles/amxx-bundle.zip "$so" > "android/app/src/main/jniLibs/arm64-v8a/$name"
            chmod +x "android/app/src/main/jniLibs/arm64-v8a/$name"
          done
          # core lib
          unzip -p bundles/amxx-bundle.zip lib/arm64-v8a/libamxmodx.so > android/app/src/main/jniLibs/arm64-v8a/libamxmodx.so
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libamxmodx.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Build the patcher APK
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Upload app APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: patcher-apk
          path: android/app/build/outputs/apk/release/*.apk

  publish:
    needs: [amxx-bundle, app-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download everything
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/release-bundles/amxx-bundle.zip
            release-assets/release-bundles/amxx-plugins.zip
            release-assets/release-bundles/amxx-addons.zip
            release-assets/patcher-apk/*.apk
          generate_release_notes: true
