;;;
; AMX Mod X module list (64-bit-cell build; arm64 = _amd64 suffix,
; arm32 = _arm suffix).
;
; All modules are built and shipped in the app's native lib dir.
; The loader resolves <name>_amxx_amd64.so / <name>_amxx_arm.so from there.
;
; Available modules:
;   engine, fakemeta, fun, geoip, json, nvault, regex,
;   sockets, sqlite, cstrike, csx, reapi, hamsandwich
;;;

; ---- enabled by default ----
engine
fakemeta
cstrike
csx
fun
geoip
json
regex
nvault
reapi
hamsandwich

; ---- available but disabled ----
;sockets
;sqlite
